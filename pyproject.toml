[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-profiler"
version = "2.0.0"
description = "Measured GPU/CPU diagnostics, empirical roofline, trace ingestion (rocprof, torch.profiler) and timeline analytics"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cyb0rg137ms" }]
requires-python = ">=3.11"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-timeout", "ruff", "mypy", "matplotlib>=3.8"]

[project.scripts]
rocm-profiler = "profiler.cli:main"

[tool.setuptools.packages.find]
include = ["profiler*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "B008", "RUF001", "RUF002", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E501", "F401", "I001", "RUF", "SIM", "UP", "W291", "W293"]
"profiler/writer.py" = ["E501", "UP", "W291", "W293", "SIM", "RUF"]
"profiler/analyser.py" = ["E501", "UP", "W291", "W293", "SIM", "C4"]
"profiler/session.py" = ["UP", "W291", "W293"]
"profiler/records.py" = ["UP"]
"profiler/__init__.py" = ["I001", "RUF022"]
"run_profiler.py" = ["E501"]
"profiler/benchmarks.py" = ["E501"]
"profiler/monitor.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=600"
