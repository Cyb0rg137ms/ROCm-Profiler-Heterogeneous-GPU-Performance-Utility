name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check profiler/timeline.py profiler/parser.py profiler/benchmarks.py
      - run: mypy profiler
      - run: pytest
      - name: Smoke benchmark
        run: rocm-profiler bench --quick
